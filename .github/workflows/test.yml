name: Jest tests

on:
  pull_request:

jobs:
  jest:
    name: Unit & browser tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Supported Node.js release lines; .node-version is the local default.
        node-version: [22, 24, 26]
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Jest
        run: npm test
