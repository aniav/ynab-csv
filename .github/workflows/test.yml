name: Jest tests

on:
  pull_request:

jobs:
  jest:
    name: Unit & browser tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Node (version from .node-version)
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Jest
        run: npm test
